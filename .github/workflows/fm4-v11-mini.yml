name: Build FM4 v1.1 Tracker Mini
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  mini:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply FM4 v1.1 sources to runner only
        run: |
          cp -R fm4/v11/overlay/. .
          echo "v1 sources preserved in GitHub; overlay applied only to this build"
      - name: Host regression tests
        run: |
          python3 tests/test_badges.py
          python3 tests/test_integration.py
          c++ -std=c++20 -O2 -Wall -Wextra -Werror tests/test_dsp.cpp -o /tmp/fm4-basic
          /tmp/fm4-basic
          c++ -std=c++20 -O2 -Wall -Wextra -Werror tests/test_v11.cpp -o /tmp/fm4-v11
          /tmp/fm4-v11
          c++ -std=c++20 -O2 -Wall -Wextra -Werror tests/test_output_modes.cpp -o /tmp/fm4-output
          /tmp/fm4-output
      - name: Integrate FM4 v1.1 with Polyend CE
        run: python3 fm4/apply_fm4.py
      - name: Install GNU Arm Toolchain 10.3
        run: |
          sudo apt-get update
          sudo apt-get install -y wget bzip2 make python3
          wget -q https://developer.arm.com/-/media/Files/downloads/gnu-rm/10.3-2021.10/gcc-arm-none-eabi-10.3-2021.10-x86_64-linux.tar.bz2
          mkdir -p agt/10.3
          tar -xjf gcc-arm-none-eabi-10.3-2021.10-x86_64-linux.tar.bz2 -C agt/10.3 --strip-components=1
      - name: Compile Tracker Mini firmware
        run: make mini
      - name: Publish firmware only on successful build
        uses: actions/upload-artifact@v4
        with:
          name: FM4-v1.1-TrackerMini-ptf
          path: build/TrackerMini_*.ptf
          if-no-files-found: error
